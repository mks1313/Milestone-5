<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Area</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        h1 { color: #e74c3c; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        p { color: #666; }
        a { color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Restricted Area</h1>
        <p>This is a restricted directory with limited access.</p>
        <p>Some methods may be forbidden here.</p>
        <p><a href="http://localhost:8080/">Return to Home</a></p>
    </div>
</body>
</html>
