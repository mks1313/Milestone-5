# **************************************************************************** #
#                                                                              #
#    webserv.conf - Configuration for 42 Tester Compatibility                  #
#                                                                              #
#    42 TESTER REQUIREMENTS (MUST ALL BE PRESENT):                             #
#                                                                              #
#    1. / must answer to GET request ONLY                                      #
#    2. /put_test/* must answer to PUT request and save files                  #
#    3. .bla files must answer to POST by calling cgi_test executable          #
#    4. /post_body must answer to POST with maxBody of 100                     #
#    5. /directory/ root=YoupiBanane, default=youpi.bad_extension              #
#                                                                              #
# **************************************************************************** #

# =============================================================================
# Server 1: Main HTTP Server (42 Tester Compatible)
# =============================================================================
server {
    listen 0.0.0.0:8080;
    
    server_name localhost webserv.local;
    
    root ./www;
    
    index index.html index.htm;
    
    client_max_body_size 1048576;
    
    autoindex off;
    
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;
    
    # =========================================================================
    # 42 REQUIREMENT 1: / must answer to GET request ONLY
    # =========================================================================
    # IMPORTANT: Only GET allowed. POST/PUT/DELETE must return 405
    location / {
        methods GET;
        autoindex off;
    }
    
    # =========================================================================
    # 42 REQUIREMENT 2: /put_test/* must answer to PUT request
    # =========================================================================
    # NOTE: Your server must IMPLEMENT PUT method (returns 501 if not)
    location /put_test {
        methods PUT GET;
        upload_store ./www/put_test;
        autoindex off;
    }
    
    # =========================================================================
    # 42 REQUIREMENT 3: .bla files must call cgi_test
    # =========================================================================
    # Handled via CGI extension mapping in /directory location
    
    # =========================================================================
    # 42 REQUIREMENT 4: /post_body with maxBody of 100
    # =========================================================================
    location /post_body {
        methods POST GET;
        client_max_body_size 100;
    }
    
    # =========================================================================
    # 42 REQUIREMENT 5: /directory/ serves YoupiBanane
    # =========================================================================
    location /directory {
        methods GET POST;
        alias ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
        cgi .bla ./testers/ubuntu_cgi_tester;
        # Allow large POST bodies for CGI testing (ubuntu_tester sends 100MB)
        client_max_body_size 104857600;
    }
    
    # =========================================================================
    # Standard CGI Configuration
    # =========================================================================
    location /cgi-bin {
        methods GET POST;
        alias ./cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .php /usr/bin/php-cgi;
        cgi .pl /usr/bin/perl;
        cgi .sh /bin/sh;
        cgi .bla ./testers/ubuntu_cgi_tester;
    }
    
    # =========================================================================
    # File Upload (multipart/form-data via POST)
    # =========================================================================
    location /upload {
        methods GET POST DELETE;
        upload_store ./www/uploads;
        autoindex off;
    }
    
    location /uploads {
        methods GET DELETE;
        root ./www;
        autoindex off;
    }
    
    # =========================================================================
    # Deletable files (for DELETE tests)
    # =========================================================================
    location /deletable {
        methods GET DELETE;
        root ./www;
        autoindex off;
    }
    
    # =========================================================================
    # Redirects
    # =========================================================================
    location /old-page {
        redirect 301 /;
    }
    
    location /google {
        redirect 302 https://www.google.com;
    }
    
    # =========================================================================
    # Static assets
    # =========================================================================
    location /static {
        methods GET;
        root ./www;
        autoindex off;
    }
}

# =============================================================================
# Server 2: Secondary Server (Port 8081)
# =============================================================================
server {
    listen 0.0.0.0:8081;
    
    server_name localhost secondary.local;
    
    root ./www/secondary;
    
    index index.html;
    
    client_max_body_size 524288;
    
    autoindex off;
    
    error_page 404 /errors/404.html;
    
    location / {
        methods GET;
        autoindex off;
    }
    
    location /cgi-bin {
        methods GET POST;
        alias ./cgi-bin;
        cgi .py /usr/bin/python3;
        cgi .bla ./testers/ubuntu_cgi_tester;
    }
}

# =============================================================================
# Server 3: Restricted Server (Port 8082)
# =============================================================================
server {
    listen 0.0.0.0:8082;
    
    server_name restricted.local;
    
    root ./www/restricted;
    
    index index.html;
    
    client_max_body_size 102400;
    
    autoindex off;
    
    location / {
        methods GET;
        autoindex off;
    }
    
    location /readonly {
        methods GET;
    }
    
    location /deletable {
        methods GET DELETE;
        alias ./www/restricted/deletable;
        autoindex off;
    }
}

# =============================================================================
# Server 4: Virtual Host (same port 8080, different server_name)
# =============================================================================
server {
    listen 0.0.0.0:8080;
    
    server_name example.local test.local;
    
    root ./www/example;
    
    index index.html;
    
    client_max_body_size 1048576;
    
    autoindex off;
    
    location / {
        methods GET POST;
    }
}
